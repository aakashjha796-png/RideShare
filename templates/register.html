
{% extends "base.html" %}

{% block title %}Register | RideShare{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-card">
        <div class="auth-icon">✨</div>

        <span class="section-tag">JOIN THE COMMUNITY</span>
        <h1>Create Account</h1>
        <p class="auth-subtitle">Start sharing journeys and saving money.</p>

        <form method="POST" class="auth-form">
            <label>Full Name</label>
            <input type="text" name="name" placeholder="Enter your full name" required>

            <label>Email Address</label>
            <input type="email" name="email" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Minimum 6 characters" minlength="6" required>

            <button type="submit" class="btn btn-primary auth-submit">
                Create My Account →
            </button>
        </form>

        <p class="auth-switch">
            Already have an account?
            <a href="{{ url_for('login') }}">Login Here</a>
        </p>
    </div>
</section>

{% endblock %}
